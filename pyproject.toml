[project]
name = "mytheus-events"
version = "0.1.0"
description = "Mytheus (NEXUS) frozen Avro event contracts + Schema Registry subjects + codegen"
requires-python = ">=3.11"
# The shipped wheel (clients/python/mytheus_events) is pydantic models only; that is the sole
# runtime dependency a downstream installer of this package actually needs. fastavro and httpx
# are codegen/test tooling (schema parsing, Schema Registry HTTP calls) used only under
# codegen/ and tests/, never imported by clients/python/mytheus_events - they belong in the dev
# group, not in a consumer's transitive install.
dependencies = [
  "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "fastavro>=1.9", "httpx>=0.27"]

# The one artifact this repo ships for consumption elsewhere: the generated pydantic client at
# clients/python/mytheus_events (see codegen/py_from_avsc.py). hatchling is the build backend
# mytheus-intelligence already uses for the same purpose (its own pyproject.toml, packages =
# ["services", "libs"]); reused here rather than introducing a second backend into the program.
# The wheel's top-level package name comes from the basename of the packages path below
# (mytheus_events), independent of the sdist/project name (mytheus-events) or this repo's own
# root layout (schemas/, codegen/, subjects/, fixtures/, contracts/ are NOT part of the wheel).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clients/python/mytheus_events"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
