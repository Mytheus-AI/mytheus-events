[project]
name = "mytheus-events"
version = "0.1.0"
description = "Mytheus (NEXUS) frozen Avro event contracts + Schema Registry subjects + codegen"
requires-python = ">=3.11"
dependencies = [
  "fastavro>=1.9",
  "pydantic>=2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
